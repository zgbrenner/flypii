name: Full-brain model and browser verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/verify.yml']
permissions:
  contents: write
concurrency:
  group: full-brain-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Numerical and validation tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Fast isolated browser harness preflight (synthetic, not full-brain evidence)
        run: |
          preflight="$RUNNER_TEMP/flypii-preflight"
          mkdir -p "$preflight"
          git archive HEAD | tar -x -C "$preflight"
          cd "$preflight"
          npm run test:fixture
          FLYPII_TEST_FIXTURE=1 TRAIN_COUNT=200 npm run train
          FLYPII_TEST_FIXTURE=1 npm run build
          FLYPII_TEST_FIXTURE=1 npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-preflight-not-full-brain-evidence
          path: ${{ runner.temp }}/flypii-preflight/reports/
      - name: Fetch immutable complete graph and verify checksums
        run: npm run data
      - name: Train and benchmark on the actual full graph
        run: npm run train
        env:
          TRAIN_COUNT: '200'
      - name: Build standalone static website
        run: npm run build
      - name: Full browser training, benchmark, privacy and responsive tests
        run: npm run test:browser
      - name: Publish verified starter model and measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/starter.json reports/*.json reports/*.jpg reports/*.png
          git commit -m "test: verified full-brain model and browser results for ${GITHUB_SHA}"
          git push origin HEAD:main
      - name: Preserve failure diagnostics without marking main as verified
        if: failure()
        run: |
          [ -d reports ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "test: FAILED validation diagnostics for ${GITHUB_SHA}"
          git push origin HEAD:validation-failed-${GITHUB_RUN_ID}
      - name: Refresh static package with browser evidence
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-brain-verification
          path: reports/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FlyPII-full-static-website
          path: dist/
