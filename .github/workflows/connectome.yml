name: Prepare full FlyWire connectome
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/prepare_data.py', '.github/workflows/connectome.yml']
permissions:
  contents: write
concurrency:
  group: prepare-flywire
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pyarrow==20.0.0
      - run: python -m unittest discover -s tests -p 'test_prepare.py'
      - run: python scripts/prepare_data.py
      - name: Publish data without overwriting an existing branch
        run: |
          if git ls-remote --exit-code --heads origin connectome-data; then
            echo 'connectome-data already exists; refusing to overwrite it.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan connectome-data
          git rm -rf --cached .
          git add data/
          git commit -m 'data: complete unthresholded FlyWire v783 proofread connectome'
          git push origin HEAD:connectome-data
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-v783-manifest
          path: data/manifest.json
